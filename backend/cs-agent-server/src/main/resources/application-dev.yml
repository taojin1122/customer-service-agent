# 开发环境配置：H2 内存数据库（零依赖开箱即用）
spring:
  datasource:
    url: jdbc:h2:mem:csagent;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
